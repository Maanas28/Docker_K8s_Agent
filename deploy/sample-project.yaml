# Example: run sample-project in Docker Desktop's local Kubernetes, so there's something real for
# the agent to read in Phase 3 (it can look at the cluster but not change it yet: you apply this).
#
#   Apply:   kubectl --context docker-desktop apply -f deploy/sample-project.yaml
#   Open:    http://localhost:30080/health
#   Remove:  kubectl --context docker-desktop delete -f deploy/sample-project.yaml
#
# The image is one the agent built on this Mac (see "which versions of sample-project do I have?").
# Docker Desktop's cluster can use local images directly when it runs in "kubeadm" mode (Settings →
# Kubernetes); in "kind" mode it can't see them and the pods show ErrImageNeverPull.
#
# To see how the agent explains failures, change the image tag and apply again:
#   v4-e54f34f-dirty  -> /health answers 500: pods run but never become ready (failing probe)
#   v99               -> image doesn't exist: ErrImageNeverPull
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-project
  labels:
    app: sample-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-project
  template:
    metadata:
      labels:
        app: sample-project
    spec:
      containers:
        - name: web
          image: sample-project:v6-e54f34f-dirty  # an exact version, not "latest"
          imagePullPolicy: Never  # only use the image on this Mac; never try a registry
          ports:
            - containerPort: 8080
          # No .env here: the app runs on its defaults (port 8080, host 0.0.0.0). Real settings
          # would come from a Secret (Phase 4).
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-project
spec:
  type: NodePort
  selector:
    app: sample-project
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
